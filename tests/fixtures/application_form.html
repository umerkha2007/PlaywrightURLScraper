<!DOCTYPE html>
<html>
<head><title>Senior Software Engineer - Apply</title></head>
<body>
  <h1>Senior Software Engineer</h1>
  <form action="/apply" id="application-form">
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name">
    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name">
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
    <label for="linkedin">LinkedIn</label>
    <input type="text" id="linkedin" name="linkedin">
    <label for="resume">Resume/CV</label>
    <input type="file" id="resume" name="resume">
    <label for="cover_letter">Cover Letter</label>
    <textarea id="cover_letter" name="cover_letter"></textarea>
    <label for="work_auth">Are you authorized to work in this country?</label>
    <select id="work_auth" name="work_auth">
      <option>Yes</option>
      <option>No</option>
    </select>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
