<!DOCTYPE html>
<html>
<head><title>Scoped Content Fixture</title></head>
<body>
  <header>
    <h1>Site Header Heading</h1>
    <a href="https://example.com/header-link">Header Link</a>
  </header>
  <main id="main-content">
    <h2>Main Content Heading</h2>
    <p>Main content paragraph.</p>
    <a href="https://example.com/main-link">Main Link</a>
    <img src="main.jpg" alt="Main image">
  </main>
  <footer>
    <a href="https://example.com/footer-link">Footer Link</a>
  </footer>
</body>
</html>
