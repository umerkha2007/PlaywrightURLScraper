<!DOCTYPE html>
<html>
<head><title>Nested Structure</title></head>
<body>
  <div class="outer">
    <div class="inner">
      <h1>Nested Heading</h1>
      <div class="content">
        <p>Nested paragraph with <a href="https://example.com/nested">a nested link</a> inside.</p>
        <ul>
          <li><a href="https://example.com/one">Item One</a></li>
          <li><a href="https://example.com/two">Item Two</a></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
